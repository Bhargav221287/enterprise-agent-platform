[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "samples/ai_generated",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["orchestrator/tests", "verifier/tests"]
